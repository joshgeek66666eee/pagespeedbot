name: noindex / nofollow monitor

# Daily check: fetches every page in the sitemap and alerts Slack if any
# carries a robots "noindex" or "nofollow" directive (meta tag or X-Robots-Tag).
#
# NOTE: scheduled workflows run ONLY from the default branch. Must be on `main`
# for the cron to fire; until then use the "Run workflow" button.

on:
  schedule:
    # 05:30 UTC daily (~08:30 Europe/Kyiv).
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      always_report:
        description: "Post a digest even if no page has noindex/nofollow"
        type: boolean
        default: false

permissions:
  contents: write   # to commit the state file (.github/state/noindex-state.json)

concurrency:
  group: noindex-monitor
  cancel-in-progress: false

jobs:
  noindex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run noindex/nofollow check
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL: "#seo-team"
          SITEMAP_URL: "https://stripo.email/sitemap_index.xml"
          # Page types to watch (same as the GSC monitor). Empty = all non-technical.
          SITEMAP_INCLUDE: "article,templateCategory,integration,toolReviewCategory,page,glossary,webinar,category"
          EXTRA_URLS: "https://stripo.email/,https://stripo.email/templates/"
          MAX_URLS: "3000"
          ALWAYS_REPORT: ${{ github.event.inputs.always_report || 'false' }}
        run: python .github/scripts/noindex_check.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/state/noindex-state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "noindex monitor: update state [skip ci]"
          git push
