name: PageSpeed biweekly monitor

# Biweekly mobile PageSpeed check. Posts to Slack only when a page's
# Performance score drops below the threshold (or on API errors).
#
# Cron can't express "every 2 weeks", so it fires every Thursday and the
# "Biweekly gate" step below runs the check only on EVEN ISO week numbers.
# Manual runs (workflow_dispatch) always run, regardless of the week.
#
# NOTE: scheduled workflows run ONLY from the repository's default branch.
# This file must be merged into `main` for the cron to fire.
# Until then, use the "Run workflow" button (workflow_dispatch) to test.

on:
  schedule:
    # 06:00 UTC every Thursday (~09:00 Europe/Kyiv); gated to even ISO weeks.
    - cron: "0 6 * * 4"
  workflow_dispatch:
    inputs:
      always_report:
        description: "Post a digest even if all pages pass"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pagespeed-monitor
  cancel-in-progress: false

jobs:
  pagespeed:
    runs-on: ubuntu-latest
    steps:
      - name: Biweekly gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            week=$(date -u +%V)          # ISO week number, 01..53
            if [ $((10#$week % 2)) -eq 0 ]; then
              echo "Even ISO week ($week) — proceeding."
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Odd ISO week ($week) — skipping this Thursday (biweekly)."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PageSpeed check
        if: steps.gate.outputs.run == 'true'
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_CHANNEL: "#seo-team"
          THRESHOLD: "80"
          STRATEGY: "mobile"
          ALWAYS_REPORT: ${{ github.event.inputs.always_report || 'false' }}
        run: python .github/scripts/pagespeed_check.py
